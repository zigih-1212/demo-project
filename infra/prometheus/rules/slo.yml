groups:
  - name: demo-api-slo
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m])) by (path)
            /
          sum(rate(http_requests_total[5m])) by (path)
            > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Доля 5xx ответов выше 5%"
          description: "Путь {{ $labels.path }} возвращает слишком много ошибок"

      - alert: HighP95Latency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le, path)
          ) > 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency выше 1 секунды"
          description: "Путь {{ $labels.path }} медленный"

      - alert: NoTraffic
        expr: sum(rate(http_requests_total[15m])) == 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "API не получает трафик"