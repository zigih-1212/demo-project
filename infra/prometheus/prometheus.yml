global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: demo

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: demo-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: demo-api
          tier: backend

  - job_name: celery-worker
    static_configs:
      - targets: ["worker:9468"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
  rules:
    - file: /etc/prometheus/rules/*.yml

rule_files:
  - /etc/prometheus/rules/*.yml