name = "demo-fullstack-backend"
main = "src/index.ts"
compatibility_date = "2026-10-23"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "demo-fullstack-db"
database_id = "eccce4dd-6cce-460b-bcb9-250604700444"

[[kv_namespaces]]
binding = "CACHE"
id = "fe73ca6ba10c43999ef6290c6bc679dc"

[[queues.producers]]
binding = "QUEUE"
queue = "demo-fullstack-queue"

[[queues.consumers]]
queue = "demo-fullstack-queue"

[vars]
ENVIRONMENT = "production"
LOG_LEVEL = "info"
# Allowed CORS origins for the SPA (comma-separated). Non-secret config.
FRONTEND_ORIGIN = "https://master.demo-fullstack-frontend.pages.dev,http://localhost:5173"
# JWT_SECRET is NOT stored here. Secrets live in wrangler.toml as plaintext and
# leak into git/CI. It is injected via `wrangler secret put JWT_SECRET` and
# stored encrypted by Cloudflare. See .env.example and ARCHITECTURE.md (ADR-011).